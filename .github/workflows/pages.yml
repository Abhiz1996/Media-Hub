name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # GitHub cron uses UTC. This runs hourly from 07:55 to 21:55 IST.
    # The extra morning slots give the dashboard multiple chances to refresh before 10:00 IST.
    - cron: "25 2-16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dashboard refresh
        run: node --test tests/dashboard-refresh.test.mjs

      - name: Generate public news data
        run: pnpm pages:data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # A real daily data commit keeps the local fallback current and prevents
      # GitHub's 60-day inactivity rule from disabling scheduled refreshes.
      - name: Save daily news snapshot
        shell: bash
        run: |
          snapshot_day=$(node -p 'JSON.parse(require("node:fs").readFileSync("docs/data/news.json", "utf8")).generatedAt.slice(0, 10)')
          saved_day=$(git show HEAD:docs/data/news.json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).generatedAt.slice(0, 10)')
          if [ "$snapshot_day" = "$saved_day" ]; then
            echo "Today's snapshot is already saved."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is pending; its run will save the snapshot."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/news.json docs/data/news.js
          git diff --cached --quiet && exit 0
          git commit -m "Update daily news snapshot for $snapshot_day"
          git push origin HEAD:main
